<h2>Menu</h2>

<k-button-row justify="start">
  <k-button style="solid" color="primary">
    <span>Hover me</span>
    <k-menu label="Menu #1">
      <k-menu-option>Item 1</k-menu-option>
      <k-menu-option>Item 2</k-menu-option>
      <k-menu-option>Item 3</k-menu-option>
    </k-menu>
  </k-button>
  <k-button style="solid" color="primary">
    <span>Hover me</span>
    <k-menu label="Menu #2">
      <k-menu-option>Item 1</k-menu-option>
      <k-menu-option>Item 2</k-menu-option>
      <k-menu-option>Item 3</k-menu-option>
    </k-menu>
  </k-button>
  <k-button style="solid" color="primary">
    <span>Click me</span>
    <k-menu label="Menu #3" trigger="click">
      <k-menu-option>Item 1</k-menu-option>
      <k-menu-option>Item 2</k-menu-option>
      <k-menu-option>Item 3</k-menu-option>
    </k-menu>
  </k-button>
  <k-button style="solid" color="primary">
    <span>Option sizes</span>
    <k-menu label="Menu sizes" trigger="click">
      <k-menu-option size="sm">Small option</k-menu-option>
      <k-menu-option size="md">Medium option</k-menu-option>
      <k-menu-option size="lg">Large option</k-menu-option>
    </k-menu>
  </k-button>
</k-button-row>
