<label [class.disabled]="disabled()" [class.invalid]="invalid()">
  <input
    type="checkbox"
    hidden
    #checkbox
    (change)="checked.set(checkbox.checked)"
    [checked]="checked()"
    [disabled]="disabled() || readonly()"
    [attr.aria-invalid]="invalid() || null"
    (blur)="touch.emit()"
  />
  <svg viewBox="0 0 100 100">
    <path class="checkmark" d="M20,50 L40,70 L80,30" />
  </svg>
  <span>{{ label() }}</span>
</label>
