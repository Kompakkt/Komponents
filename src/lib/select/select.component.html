@if (label(); as label) {
  <span class="label">{{ label }}</span>
}
<button
  class="trigger"
  type="button"
  [class.invalid]="invalid() && touched()"
  [disabled]="disabled()"
  [attr.aria-invalid]="invalid() && touched() ? true : null"
  [attr.aria-describedby]="touched() && invalid() && errors().length ? 'k-select-errors' : null"
  [attr.required]="required() || null"
  (blur)="touch.emit()"
>
  <span class="trigger-viewport">
    <span #triggerTextEl class="trigger-text">{{ triggerText() || placeholder() }}</span>
  </span>
  <span class="arrow">▼</span>
</button>
<div
  #dropdown
  class="dropdown"
  [attr.popover]="'auto'"
  (toggle)="onPopoverToggle($event)"
  (click)="onDropdownClick($event)"
>
  <ng-content />
</div>
@if (touched() && invalid() && errors().length) {
  <div class="error-messages" role="alert" id="k-select-errors">
    @for (error of errors(); track $index) {
      <span class="error">{{ error.message }}</span>
    }
  </div>
}
